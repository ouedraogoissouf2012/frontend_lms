server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # L'INVARIANT : seuls les fichiers de /assets/ portent un hash de contenu
    # dans leur nom. Pour tout le reste — index.html, heartbeat-worker.js,
    # 50x.html — le navigateur ne peut PAS savoir que le fichier a changé.
    #
    # Sans directive, il applique une heuristique et les garde. Or index.html
    # DÉSIGNE les assets à charger : un index.html périmé, combiné à des assets
    # marqués `immutable` un an, donne une application ancienne mais parfaitement
    # cohérente — donc invisible. Constaté en production le 2026-09-02 : un
    # utilisateur exécutait le code d'avant-déploiement, à la ligne près, y
    # compris en navigation privée.
    #
    # `no-cache` ne veut pas dire « ne pas stocker » : le navigateur conserve le
    # fichier mais REVALIDE à chaque visite. Avec l'ETag que nginx envoie déjà,
    # une page inchangée coûte un 304 vide.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        # Content-Security-Policy en mode RAPPORT (#279) : n'impose RIEN encore,
        # signale seulement ce qui violerait la politique (console navigateur).
        # Étape 1 du déploiement : on observe sur le prod réel avant de basculer en
        # `Content-Security-Policy` (enforce) une fois les rapports à zéro. Report-Only
        # NE PEUT PAS passer par <meta> (interdit par le spec) -> en-tête serveur.
        #
        #  - script-src 'self' : plus aucun script inline (externalisé -> /app-loader.js)
        #    ni CDN -> durcissement clé contre le vol de token XSS (lié #223).
        #  - style-src 'unsafe-inline' : Vite/Vue injectent des styles au runtime + le
        #    splash inline ; risque faible, indispensable sinon l'app casse.
        #  - connect-src 'self' https: wss: : large VOLONTAIREMENT ici — l'API et la
        #    visio varient par tenant (build-args VITE_API_URL/JITSI) ; `wss:` couvre la
        #    signalisation Jitsi. On resserrera à `'self' <api-origin>` par déploiement
        #    (envsubst) avant l'enforce — #297 (différé, nécessite le serveur).
        #  - frame-src : iframes légitimes (vidéos de leçon YouTube/Vimeo, visio Jitsi).
        #    #297 : `youtube-nocookie` (jamais utilisé) et `worker-src blob:` (le
        #    heartbeat worker est same-origin) retirés — entrées mortes.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://meet.jit.si; media-src 'self' https: blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # #297 : directives SÛRES en ENFORCE dès maintenant (risque de casse ≈ nul —
        # cf. l'issue) — corrige l'« ordre d'enforce inversé ». Le reste (connect-src
        # resserré par tenant via envsubst, en-tête Reporting-Endpoints vers
        # /csp-report) attend le déploiement + l'endpoint backend.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;

        # Durcissements sans risque (enforce direct, pas report-only).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Noms hachés par Vite : un contenu différent produit un nom différent.
    # Le cache long est donc sûr, et c'est lui qui rend le site rapide.
    #
    # Un SEUL en-tête : `expires 1y` en émettait déjà un, auquel `add_header`
    # en ajoutait un second. Deux `Cache-Control` concurrents sur la même
    # réponse sont valides mais ambigus — les navigateurs les recombinent, les
    # proxies pas toujours de la même façon. Une directive explicite vaut mieux
    # que deux qui se complètent par accident.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Empêche le MIME-sniffing des JS/CSS hachés (#279).
        add_header X-Content-Type-Options "nosniff" always;
    }
}
