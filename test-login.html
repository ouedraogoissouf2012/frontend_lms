<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Test de Connexion LMS</h1>
    <button onclick="testLogin()">Tester la connexion</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Connexion en cours...</p>';

            try {
                const response = await axios.post('http://localhost:8000/api/auth/login', {
                    username: 'superadmin',
                    password: 'password123'
                }, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                console.log('Réponse complète:', response);

                if (response.data.success) {
                    resultDiv.innerHTML = `
                        <h2 style="color: green;">✅ Connexion réussie !</h2>
                        <p><strong>Utilisateur:</strong> ${response.data.data.user.name}</p>
                        <p><strong>Email:</strong> ${response.data.data.user.email}</p>
                        <p><strong>Rôle:</strong> ${response.data.data.user.role}</p>
                        <p><strong>Token:</strong> ${response.data.data.token.substring(0, 20)}...</p>
                        <pre>${JSON.stringify(response.data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ Échec: ${response.data.message}</p>`;
                }
            } catch (error) {
                console.error('Erreur:', error);
                resultDiv.innerHTML = `
                    <h2 style="color: red;">❌ Erreur de connexion</h2>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p><strong>Détails:</strong> ${error.response ? error.response.data.message : 'Pas de réponse du serveur'}</p>
                    <pre>${JSON.stringify(error.response?.data || error, null, 2)}</pre>
                `;
            }
        }
    </script>
</body>
</html>
