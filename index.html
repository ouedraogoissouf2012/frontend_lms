<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LMS - Learning Management System</title>
  <!-- Icônes auto-hébergées (Font Awesome + Material Icons) importées dans
       src/main.js (#279) : plus de CDN externe -> CSP font/style-src 'self'. -->
  <style>
    /* Splash Screen Loader NSIA */
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1B3B6F 0%, #0D1F40 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
    }

    .loader-logo {
      margin-bottom: 2rem;
      animation: pulse-logo 2s ease-in-out infinite;
    }

    .loader-logo svg {
      filter: drop-shadow(0 0 20px rgba(255, 184, 28, 0.5));
    }

    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #1B3B6F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }

    .loader-text {
      color: white;
      font-size: 1.125rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: pulse-text 1.5s ease-in-out infinite;
    }

    .loader-subtext {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <!-- Splash Screen Loader -->
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <!-- SVG inline : le splash ne dépend d'aucune police externe/tardive (#279). -->
        <svg viewBox="0 0 24 24" width="80" height="80" fill="#FFB81C" aria-hidden="true">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
      </div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Chargement en cours...</div>
      <div class="loader-subtext">Learning Management System</div>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  <!-- Script externalisé (#279) pour permettre une CSP script-src 'self' stricte. -->
  <script src="/app-loader.js"></script>
</body>
</html>
