<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LMS - Learning Management System</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Splash Screen Loader NSIA */
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1B3B6F 0%, #0D1F40 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
    }

    .loader-logo {
      margin-bottom: 2rem;
      animation: pulse-logo 2s ease-in-out infinite;
    }

    .loader-logo i {
      font-size: 5rem;
      color: #FFB81C;
      filter: drop-shadow(0 0 20px rgba(255, 184, 28, 0.5));
    }

    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #1B3B6F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }

    .loader-text {
      color: white;
      font-size: 1.125rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: pulse-text 1.5s ease-in-out infinite;
    }

    .loader-subtext {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-Cuxgng8j.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-hF_r0qEw.css">
</head>
<body>
  <!-- Splash Screen Loader -->
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <i class="material-icons">school</i>
      </div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Chargement en cours...</div>
      <div class="loader-subtext">Learning Management System</div>
    </div>
  </div>

  <div id="app"></div>

  <script>
    // Masquer le loader une fois que l'app Vue est montée
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(function() {
            loader.style.display = 'none';
          }, 500);
        }
      }, 300); // Petit délai pour voir l'animation
    });
  </script>
</body>
</html>
