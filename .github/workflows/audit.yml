name: Audit planifié

# #432 : la CI ne contrôlait les dépendances qu'au moment d'un push ou d'une PR. Un avis de
# sécurité publié sur une dépendance DÉJÀ installée restait invisible jusqu'au push suivant
# (34 jours mesurés le 29/10/2026). Ce workflow rejoue chaque semaine, et à la demande, le
# MÊME contrôle que le job « NPM Audit » de lint.yml, sans le reste de la chaîne.
on:
  schedule:
    # Lundi 06:00 UTC, avant la fenêtre de Dependabot (même jour).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit (planifié)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
