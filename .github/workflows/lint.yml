name: CI

# 1) Anti-regression guard for hardcoded colors (issue #161): fails any PR /
#    push that introduces a hardcoded hex color not present in the committed
#    baseline (.stylelint-color-baseline.json).
# 2) Unit tests (Vitest), including the guard's destructive suite.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  lint-css:
    name: Stylelint (hardcoded colors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS (no new hardcoded colors)
        run: npm run lint:css

  test:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --retry=2 : quelques montages lourds (éditeur TipTap) et un test
      # sensible à l'horloge peuvent dépasser leur timeout sous charge ; le
      # retry ne masque pas une vraie régression (elle échouerait 3 fois),
      # il neutralise les timeouts ponctuels d'environnement.
      - name: Run unit tests
        run: npm run test -- --retry=2
