name: CI

# 1) Anti-regression guard for hardcoded colors (issue #161): fails any PR /
#    push that introduces a hardcoded hex color not present in the committed
#    baseline (.stylelint-color-baseline.json).
# 2) Anti-regression guard for source file size (issue #195): fails any PR /
#    push that introduces a new source file > 300 lines or grows a baseline file.
# 3) Unit tests (Vitest), including the guard's destructive suite.
# 4) Contrat API via le runner natif Node (`npm run test:contract`) : le contrat
#    frontend <-> backend Laravel est aussi joué sous Vitest
#    (`tests/contract/api-contract.test.mjs`), mais par un chemin d'exécution
#    DIFFÉRENT (Vite/jsdom + alias `@`). Le runner natif, lui, résout les imports
#    avec `node-resolver.mjs` sans Vite : c'est la commande documentée dans
#    CONTRIBUTING.md §3, et la seule qui garantisse qu'elle reste exécutable.
#    Elle sort en code 1 dès qu'une assertion échoue (run-contract.mjs:38).
# 5) Build de production (`npm run build`) : sans ce job, une PR qui casse le
#    build (import mort, erreur de résolution d'alias, SFC invalide) passe au
#    vert — les tests tournent sous Vitest/jsdom, pas sur le bundle réel.
#    Vérifie aussi que le code splitting des routes (CONTRIBUTING.md §2) tient.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint-css:
    name: Stylelint (hardcoded colors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS (no new hardcoded colors)
        run: npm run lint:css

  lint-size:
    name: File size guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source file sizes
        run: npm run lint:size

  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS/Vue
        run: npm run lint

  test:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pas de `--retry` (#282) : il masquait AUSSI les vraies régressions
      # intermittentes — un bug qui échoue 30 % du temps repasse au vert en
      # 3 essais ~66 % du temps (l'ancienne note « elle échouerait 3 fois »
      # était fausse). Les timeouts de montage légitimes sont désormais absorbés
      # par `testTimeout: 15000` (vitest.config.js), pas dissimulés. Une suite qui
      # flappe doit être rendue déterministe, jamais ré-essayée.
      - name: Run unit tests
        run: npm run test

  contract:
    name: Tests de contrat API (runner natif)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Aucun backend requis : `captureAdapter.mjs` remplace `api.defaults.adapter`
      # de l'instance axios partagée — les requêtes sont capturées, jamais émises.
      - name: Run API contract tests
        run: npm run test:contract

  build:
    name: Build de production (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # L'avertissement « chunk > 500 kB » (LessonChapters) est connu et assumé
      # (CONTRIBUTING.md §3) : c'est un warning Rollup, le build sort en code 0.
      - name: Build production bundle
        run: npm run build

  # 6) SAST (issue #241) : analyse statique de sécurité du code source front via
  #    Semgrep (règles OSS security-audit + javascript), pour combler l'asymétrie
  #    avec le backend (Semgrep déjà en CI). Bloque UNIQUEMENT sur les findings de
  #    sévérité ERROR ; les WARNING/INFO restent visibles dans les logs sans casser
  #    la CI (introduction progressive — cf. #241).
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (ERROR bloquant)
        run: semgrep scan --config p/security-audit --config p/javascript --severity ERROR --error src/
