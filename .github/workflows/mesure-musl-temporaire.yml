# TEMPORAIRE (#497, D96) : mesure du build en musl (node:24-alpine, la base de Dockerfile.prod),
# dev @ce27d0e8 contre la tête de la PR. Ce fichier sera retiré par un commit de retour.
name: Mesure musl temporaire

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  mesure:
    name: Mesure musl (dev contre branche)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ce27d0e880575bcdbfc0c9697e2d0f895e3d59d4
          path: dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: branche
      - name: Script de mesure
        run: |
          cat > mesure.sh <<'SH'
          set -eu
          nom="$1"
          cd "/w/$nom"
          npm ci --no-audit --no-fund
          VITE_JITSI_DOMAIN=visio.example.test VITE_API_URL=https://api.example.test/api npx vite build --sourcemap
          {
            echo "### $nom ($(node -p "require('./node_modules/vite/package.json').version") vite, $(node -p "require('./node_modules/esbuild/package.json').version") esbuild, libc $(ldd --version 2>&1 | head -1))"
            echo ""
            echo "- assets (hors .map) : $(find dist/assets -type f ! -name '*.map' | wc -l)"
            echo "- taille (hors .map) : $(find dist -type f ! -name '*.map' -exec cat {} + | wc -c) octets"
            echo "- notices /*! : JS $(cat dist/assets/*.js | grep -o '/\*!' | wc -l), CSS $(cat dist/assets/*.css | grep -o '/\*!' | wc -l)"
            echo "- console. par méthode :"
            cat dist/assets/*.js | grep -o 'console\.[a-zA-Z]*' | sort | uniq -c | sed 's/^/    /'
            echo ""
            echo "| méthode | asset | module d'origine (sourcemap) | ligne |"
            echo "|---|---|---|---|"
            node /w/origine.cjs "/w/$nom"
            echo ""
          } > "/w/resultat-$nom.md"
          SH
          cat > origine.cjs <<'JS'
          // Pour chaque « console.x » du JS livré : le module source d'origine, par la sourcemap.
          const fs = require('fs'), path = require('path')
          const racine = process.argv[2]
          const { SourceMapConsumer } = require(path.join(racine, 'node_modules/source-map-js'))
          const dossier = path.join(racine, 'dist/assets')
          for (const f of fs.readdirSync(dossier).filter((n) => n.endsWith('.js')).sort()) {
            const code = fs.readFileSync(path.join(dossier, f), 'utf8')
            const carte = fs.existsSync(path.join(dossier, f + '.map'))
              ? new SourceMapConsumer(JSON.parse(fs.readFileSync(path.join(dossier, f + '.map'), 'utf8')))
              : null
            const debuts = [0]
            for (let i = 0; i < code.length; i++) if (code[i] === '\n') debuts.push(i + 1)
            for (const m of code.matchAll(/console\.([a-zA-Z]+)/g)) {
              let ligne = debuts.length - 1
              while (debuts[ligne] > m.index) ligne--
              const pos = carte ? carte.originalPositionFor({ line: ligne + 1, column: m.index - debuts[ligne] }) : {}
              const src = (pos.source || '(sans correspondance)').replace(/^.*node_modules\//, 'node_modules/')
              console.log(`| ${m[1]} | ${f.replace(/-[A-Za-z0-9_-]{8}\.js$/, '.js')} | ${src} | ${pos.line ?? ''} |`)
            }
          }
          JS
      - name: Build et mesure dans node:24-alpine (musl), dev puis branche
        run: |
          for nom in dev branche; do
            docker run --rm -v "$PWD:/w" node:24-alpine sh /w/mesure.sh "$nom"
          done
      - name: Résumé
        if: always()
        run: |
          cat resultat-dev.md resultat-branche.md 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
